<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ember</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="shell">
  <aside class="side" id="side">
    <a class="brand" href="#/today">
      <img src="/logo.svg" width="30" height="30" alt="">
      <span>Ember</span>
    </a>
    <label class="search">
      <svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true"><circle cx="9" cy="9" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m14 14 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="Search notes" autocomplete="off" aria-label="Search notes">
    </label>
    <nav class="nav" id="nav">
      <a href="#/today" data-view="today">Today</a>
      <a href="#/connect" data-view="connect">Connect</a>
      <a href="#/tensions" data-view="tensions">Tensions</a>
      <a href="#/graph" data-view="graph">Graph</a>
      <a href="#/ask" data-view="ask">Ask</a>
      <a href="#/digest" data-view="digest">Digest</a>
    </nav>
    <div class="tree-head"><span>Notes</span><button id="new" class="ghost" title="New note" aria-label="New note">+</button></div>
    <div class="tree" id="tree"></div>
    <a class="settings-link" href="#/settings" data-view="settings">Settings</a>
  </aside>
  <button class="menu" id="menu" aria-label="Show notes">☰</button>
  <main class="main" id="main" tabindex="-1"></main>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="/app.js" type="module"></script>
</body>
</html>
