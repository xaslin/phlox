<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ember</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%231b1714'/%3E%3Cpath d='M16 6c1 5 6 6 6 12a6 6 0 0 1-12 0c0-3 2-4 3-6 1 2 2 2 3 2 0-3-1-5 0-8z' fill='%23f0913a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="shell">
  <aside class="side" id="side">
    <a class="brand" href="#/today">
      <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><path d="M16 4c1.2 6 7 7.5 7 14.5a7 7 0 0 1-14 0c0-3.6 2.4-5 3.6-7.4 1 2.4 2.2 2.6 3.4 2.6 0-3.6-1.2-6 0-9.7z" fill="currentColor"/></svg>
      <span>Ember</span>
    </a>
    <label class="search">
      <svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true"><circle cx="9" cy="9" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m14 14 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="Search notes" autocomplete="off" aria-label="Search notes">
    </label>
    <nav class="nav" id="nav">
      <a href="#/today" data-view="today">Today</a>
      <a href="#/connect" data-view="connect">Connect</a>
      <a href="#/tensions" data-view="tensions">Tensions</a>
      <a href="#/graph" data-view="graph">Graph</a>
      <a href="#/ask" data-view="ask">Ask</a>
      <a href="#/digest" data-view="digest">Digest</a>
    </nav>
    <div class="tree-head"><span>Notes</span><button id="new" class="ghost" title="New note" aria-label="New note">+</button></div>
    <div class="tree" id="tree"></div>
    <a class="settings-link" href="#/settings" data-view="settings">Settings</a>
  </aside>
  <button class="menu" id="menu" aria-label="Show notes">☰</button>
  <main class="main" id="main" tabindex="-1"></main>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="/app.js" type="module"></script>
</body>
</html>
