<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Phlox</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="shell">
  <aside class="side" id="side">
    <div class="side-top">
      <a class="brand" href="#/today"><img src="/logo.svg" width="20" height="20" alt=""><span>Phlox</span></a>
      <button class="icon" id="new" title="New note" aria-label="New note"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="icon" id="open-palette" title="Search or jump to a note (⌘K)" aria-label="Search or jump to a note"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg></button>
    </div>
    <nav class="nav" id="nav" aria-label="Screens">
      <a href="#/today" data-view="today"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span>Today</span></a>
      <a href="#/tasks" data-view="tasks"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 11 3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg><span>Tasks</span><b class="count" id="b-tasks"></b></a>
      <a href="#/connect" data-view="connect"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg><span>Connect</span><b class="count" id="b-connect"></b></a>
      <a href="#/tensions" data-view="tensions"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg><span>Tensions</span><b class="count" id="b-tensions"></b></a>
      <a href="#/graph" data-view="graph"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="8" r="2.5"/><circle cx="10" cy="18" r="2.5"/><path d="m8.4 6.5 7.1 1M6.8 8.4l2.3 7.2M16.5 10l-4.9 6.2"/></svg><span>Graph</span></a>
      <a href="#/sphere" data-view="sphere"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg><span>Sphere</span></a>
      <a href="#/ask" data-view="ask"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg><span>Ask</span></a>
      <a href="#/digest" data-view="digest"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5 9-5z"/><path d="m3 13 9 5 9-5"/></svg><span>Digest</span></a>
    </nav>
    <div class="tree" id="tree"></div>
    <a class="settings-link" href="#/settings" data-view="settings"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><span>Settings</span></a>
  </aside>
  <section class="pane">
    <header class="bar">
      <button class="icon menu" id="menu" aria-label="Show the sidebar"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <button class="icon" id="back" title="Back" aria-label="Back"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></button>
      <button class="icon" id="fwd" title="Forward" aria-label="Forward"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button>
      <div class="bar-title" id="bar-title"></div>
      <div class="bar-actions" id="bar-actions"></div>
    </header>
    <main class="main" id="main" tabindex="-1"></main>
    <footer class="status"><span id="vaultstat"></span><span class="grow"></span><span id="viewstat"></span></footer>
  </section>
</div>
<dialog class="palette" id="palette" aria-label="Search or jump to a note">
  <input id="pq" type="text" autocomplete="off" spellcheck="false" aria-label="Type a note name or some words" aria-controls="pl">
  <div class="pal-list" id="pl" role="listbox"></div>
</dialog>
<div class="peek" id="peek" hidden></div>
<div class="toast" id="toast" role="status"></div>
<script src="/app.js" type="module"></script>
</body>
</html>
