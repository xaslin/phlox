<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- A phlox flower: five notched petals around a darker eye. -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="#17161a"/>
  <g transform="translate(512 520)">
    <g fill="#a48bf5">
      <path id="petal" d="M0 -40 C-120 -90 -150 -250 -62 -306 C-36 -322 -12 -310 0 -284 C12 -310 36 -322 62 -306 C150 -250 120 -90 0 -40z"/>
      <use href="#petal" transform="rotate(72)"/>
      <use href="#petal" transform="rotate(144)"/>
      <use href="#petal" transform="rotate(216)"/>
      <use href="#petal" transform="rotate(288)"/>
    </g>
    <g stroke="#7458d6" stroke-width="14" stroke-linecap="round">
      <path id="vein" d="M0 -70 L0 -170"/>
      <use href="#vein" transform="rotate(72)"/>
      <use href="#vein" transform="rotate(144)"/>
      <use href="#vein" transform="rotate(216)"/>
      <use href="#vein" transform="rotate(288)"/>
    </g>
    <circle r="62" fill="#5a3fbd"/>
    <circle r="24" fill="#f3efff"/>
  </g>
</svg>
